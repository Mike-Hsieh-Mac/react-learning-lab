# ============================================================================
# docker-compose.yml：用「一個指令」啟動整套服務
#
# 沒有 compose 時你要打：
#   docker build -t react-learning .
#   docker run -d -p 8080:8080 -v learning-data:/app/data react-learning
# 有了 compose 只要：
#   docker compose up -d
#
# compose 的價值在「多服務編排」：之後要加 PostgreSQL、Redis，
# 只要在 services 底下多寫一段，它們會自動在同一個網路裡互相看得見。
# ============================================================================
services:
  app:
    # build: . 表示用目前資料夾的 Dockerfile 建置映像檔
    build: .
    image: react-learning:latest
    container_name: react-learning
    ports:
      # 「主機 port : 容器 port」——瀏覽器打 localhost:8080，
      # Docker 會轉進容器裡的 8080（Spring Boot）
      - "8080:8080"
    volumes:
      # 具名 volume：把容器的 /app/data（H2 資料庫檔案）存到 Docker 管理的空間。
      # 容器砍掉重建（docker compose down && up），資料依然都在。
      # 想徹底清空資料庫才用：docker compose down -v
      - learning-data:/app/data
    restart: unless-stopped

  # ---------- 16. 串接外部資料庫練習：MySQL ----------
  # 平常不會啟動（用 profiles 隔開），要練習時才下：
  #   docker compose --profile mysql up -d
  # 啟動後 Spring Boot 要用 --spring.profiles.active=mysql 讀取 application-mysql.properties。
  mysql:
    image: mysql:8.4
    container_name: react-learning-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: learning_lab
      MYSQL_USER: learner
      MYSQL_PASSWORD: learn123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  # ---------- 16. 串接外部資料庫練習：PostgreSQL ----------
  # 練習時下：docker compose --profile postgres up -d
  # 啟動後 Spring Boot 要用 --spring.profiles.active=postgres 讀取 application-postgres.properties。
  postgres:
    image: postgres:16-alpine
    container_name: react-learning-postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: learning_lab
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learn123
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  # 選用：PostgreSQL 的網頁 GUI，方便不裝 DBeaver 也能看資料表。
  # docker compose --profile postgres up -d 會連 pgadmin 一起啟動。
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: react-learning-pgadmin
    profiles: ["postgres"]
    environment:
      PGADMIN_DEFAULT_EMAIL: learner@example.com
      PGADMIN_DEFAULT_PASSWORD: learn123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  learning-data:
  mysql-data:
  pg-data:

