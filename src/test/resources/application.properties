# ============ 測試專用資料庫設定 ============
# 跑 mvnw test 時，src/test/resources 的這份設定會「覆蓋」main 的同名設定。
#
# 為什麼測試不用檔案版 H2、改用記憶體版（jdbc:h2:mem:）？
# 1. 隔離：測試建立的假資料不會污染你真正的 ./data/learning-lab.mv.db。
# 2. 避免檔案鎖：H2 檔案模式同一時間只能被一個程式開啟，
#    如果 Spring Boot 正在跑、又同時跑測試，檔案版會直接報錯。
# 3. 乾淨：DB_CLOSE_DELAY=-1 讓資料庫活到 JVM 結束，測試跑完自動蒸發，
#    每次測試都是全新的空資料庫，結果穩定可重現。
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# create-drop：測試啟動時建表、結束時刪表，保證每輪測試從零開始。
spring.jpa.hibernate.ddl-auto=create-drop

