# ============================================================================
# MySQL 連線設定（Spring Profile：mysql）
#
# 這個檔案平常不會被讀到！Spring Boot 只有在啟動時指定
#   --spring.profiles.active=mysql
# 或在 docker-compose.yml 的 environment 加
#   SPRING_PROFILES_ACTIVE=mysql
# 才會載入這份設定，並且會「疊加」在 application.properties 之上
# （這裡沒寫到的設定，像 server.port，還是沿用 application.properties 的值）。
#
# 啟用步驟：
#   1. pom.xml 打開 mysql-connector-j 那組依賴（註解拿掉）
#   2. docker compose --profile mysql up -d   # 只啟動 mysql 服務（見 docker-compose.yml）
#   3. mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#      或打包後：java -jar app.jar --spring.profiles.active=mysql
# ============================================================================

# jdbc:mysql://主機:port/資料庫名稱
# 本機跑 docker compose 時，MySQL 容器對外開 3306，所以主機是 localhost；
# 如果 Spring Boot 本身也是用 docker compose 的 app 服務啟動，
# 則要改成服務名稱 jdbc:mysql://mysql:3306/learning_lab（容器之間用服務名互連，不是 localhost，這是新手最常踩的坑）。
spring.datasource.url=jdbc:mysql://localhost:3306/learning_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=learner
spring.datasource.password=learn123

# MySQL 用的 Hibernate 方言；Spring Boot 其實大多能自動偵測，
# 寫出來只是讓新手清楚知道「不同資料庫，SQL 語法細節不一樣，Hibernate 要知道該產生哪一種 SQL」。
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 跟 H2 一樣：開發/學習先用 update 自動建表，正式環境建議改 validate + Flyway/Liquibase 做版本控管的 migration。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MySQL 沒有像 H2 那樣內建網頁管理介面，常見做法是另外裝 GUI 工具
# （DBeaver、MySQL Workbench、或在 docker-compose 加 phpMyAdmin 服務）用帳密連線查看資料。


