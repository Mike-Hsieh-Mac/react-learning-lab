# ============================================================================
# PostgreSQL 連線設定（Spring Profile：postgres）
#
# 跟 application-mysql.properties 一樣，只有指定
#   --spring.profiles.active=postgres
# 才會生效，且會疊加在 application.properties 之上。
#
# 啟用步驟：
#   1. pom.xml 打開 postgresql 那組依賴（註解拿掉）
#   2. docker compose --profile postgres up -d   # 只啟動 postgres 服務（見 docker-compose.yml）
#   3. mvn spring-boot:run -Dspring-boot.run.profiles=postgres
#      或打包後：java -jar app.jar --spring.profiles.active=postgres
# ============================================================================

# 容器對外開 5432；如果是 Spring Boot 也用 docker compose 的 app 服務啟動，
# 要改成服務名稱 jdbc:postgresql://postgres:5432/learning_lab（容器間用服務名互連，不是 localhost）。
spring.datasource.url=jdbc:postgresql://localhost:5432/learning_lab
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=learner
spring.datasource.password=learn123

# PostgreSQL 的 Hibernate 方言。
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQL 常見的 GUI 管理工具是 pgAdmin（docker-compose.yml 裡也示範了怎麼加這個服務），
# 或用 DBeaver 這種通用資料庫工具連線查看資料。

