spring.application.name=React_Learning
server.port=8080
server.error.include-message=always
spring.jackson.serialization.indent-output=true

# ============ 資料庫設定（H2 檔案模式） ============
# jdbc:h2:file:./data/learning-lab 表示：
#   把資料存成專案根目錄下的 ./data/learning-lab.mv.db 檔案，
#   重啟 Spring Boot 後資料「不會消失」（這就是和之前記憶體版最大的差別）。
# 之後要換 MySQL 時，只要把這 4 行換成 MySQL 的 url/driver/帳密即可，程式碼不用動。
spring.datasource.url=jdbc:h2:file:./data/learning-lab
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update：啟動時 Hibernate 會比對 Entity 和資料表結構，
#   表不存在就自動 CREATE TABLE、加了新欄位就自動 ALTER TABLE。
#   適合開發/學習用；正式環境通常改用 validate + 資料庫遷移工具（如 Flyway）。
spring.jpa.hibernate.ddl-auto=update

# 把 Hibernate 實際執行的 SQL 印在 console，方便觀察「JPA 到底幫你下了什麼 SQL」。
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 內建的網頁管理介面：啟動後打開 http://localhost:8080/h2-console
#   JDBC URL 填 jdbc:h2:file:./data/learning-lab、帳號 sa、密碼留空，
#   就能直接下 SQL（例如 SELECT * FROM TASKS）查看資料。
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

